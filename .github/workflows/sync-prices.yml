name: Sync product prices

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call price sync endpoint
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SYNC_SECRET }}" \
            "https://tecnotics-platform.vercel.app/api/cron/sync-prices"
