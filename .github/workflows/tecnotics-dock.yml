name: Build Tecnotics Dock

on:
  push:
    paths:
      - "tools/tecnotics-dock/**"
      - ".github/workflows/tecnotics-dock.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        working-directory: tools/tecnotics-dock
        run: dotnet build -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: TecnoticsDock
          path: tools/tecnotics-dock/bin/Release/net48/TecnoticsDock.exe
